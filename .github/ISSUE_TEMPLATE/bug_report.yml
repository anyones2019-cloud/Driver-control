name: Bug report
description: Bug reporting chat. First try of the project.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This is the first try of the project. We may not get it right on the first go. We are here to learn and make Linux better.
        Discuss the project here. Debate the issue, not the person. Do not pick on the reporter or the owner.
        Test only in a Linux virtual machine.
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Fedora 44
    validations:
      required: true
  - type: input
    id: vm
    attributes:
      label: VM software
      placeholder: GNOME Boxes, VirtualBox, QEMU
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
