name: Bug report
description: Bug reporting chat. Debate the issue, do not pick on the person.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This is the bug reporting chat.
        Research the claim. Use common sense. Debate the issue, not the person.
        Do not pick on the reporter or the owner.
        Test only in a Linux virtual machine. Do not report bare-metal runs.
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Fedora 44
    validations:
      required: true
  - type: input
    id: vm
    attributes:
      label: VM software
      placeholder: GNOME Boxes, VirtualBox, QEMU
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU family and driver branch
      placeholder: Kepler, NVIDIA 470.xx
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: debate
    attributes:
      label: What should be debated
      description: The issue to sort, not a complaint about a person.
    validations:
      required: true
