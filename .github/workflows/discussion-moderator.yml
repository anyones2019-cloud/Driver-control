name: Discussion moderator

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  moderate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Debate the post, not the person
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.sender.login }}
          NUMBER: ${{ github.event.discussion.number }}
        working-directory: tools
        run: |
          set -euo pipefail
          python3 -m unittest test_moderate_discussion.py
          python3 moderate_discussion.py > /tmp/moderator-note.txt
          jq -n --rawfile body /tmp/moderator-note.txt '{body:$body}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/discussions/${NUMBER}/comments" --input -
