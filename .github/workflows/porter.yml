name: Porter

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  discussion:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

jobs:
  greet:
    if: github.actor != 'github-actions[bot]' && github.actor != 'anyones2019-cloud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Greet a new programmer
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login || github.event.discussion.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          set -euo pipefail
          python3 -m unittest test_porter.py
          issues=$(gh api --method GET search/issues -f q="repo:${GITHUB_REPOSITORY} author:${AUTHOR}" --jq .total_count)
          discussions=$(gh api graphql -f query='query($q:String!){ search(query:$q, type:DISCUSSION, first:1) { discussionCount } }' -f q="repo:${GITHUB_REPOSITORY} author:${AUTHOR}" --jq .data.search.discussionCount)
          current=1
          earlier=$((issues + discussions - current))
          if [ "$earlier" -lt 0 ]; then earlier=0; fi
          export EARLIER_POSTS="$earlier"
          python3 porter.py > /tmp/porter-note.txt
          if grep -q '^No greeting' /tmp/porter-note.txt; then
            exit 0
          fi
          if [ -n "${DISCUSSION_ID}" ]; then
            jq -n --rawfile body /tmp/porter-note.txt --arg id "$DISCUSSION_ID" \
              '{query:"mutation($id:ID!, $body:String!) { addDiscussionComment(input:{discussionId:$id, body:$body}) { comment { url } } }", variables:{id:$id, body:$body}}' \
              | gh api graphql --input -
          else
            jq -n --rawfile body /tmp/porter-note.txt '{body:$body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --input -
          fi
